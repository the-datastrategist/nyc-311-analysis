[tool.poetry]
name = "tds_dbt_template"
version = "0.1.0"
description = "Reusable dbt + BigQuery project template"
authors = ["Gordon Silvera <gordon@thedatastrategist.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
python-dotenv = "^1.0.0"
dbt-core = "^1.7.0"
dbt-bigquery = "^1.7.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
