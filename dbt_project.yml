
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'national_grid'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'default'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["dbt/models"]
analysis-paths: ["dbt/analyses"]
test-paths: ["dbt/tests"]
seed-paths: ["dbt/seeds"]
macro-paths: ["dbt/macros"]
snapshot-paths: ["dbt/snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.
models:
  national_grid:
    # Config indicated by + and applies to all files under models/example/
    # example:
    #   +materialized: view
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table


vars:

  # BigQuery connection used by AI.GENERATE() for LLM-generated insights.
  # Must reference an existing BigQuery Cloud Resource connection with Vertex AI access,
  # e.g. `bq mk --connection --connection_type=CLOUD_RESOURCE --location=us vertex_ai_connection`
  bq_ai_connection_id: 'us.vertex_gemini'
  bq_ai_endpoint: 'gemini-2.5-flash'

  feature_sets:

    datetime:
      - holiday_name
      - is_holiday
      - postholiday_days
      - preholiday_days
      - days_since_holiday
      - has_days_since_holiday
      - month_number
      - day_number
      - sin_month_number
      - cos_month_number
      - sin_day_number
      - cos_day_number

    request_counts:
      - requests
      - requests_next_1day
      - requests_next_7day

    request_metrics:
      - avg_requests_last_3day
      - avg_requests_last_7day
      - avg_requests_last_14day
      - avg_requests_last_28day
      - avg_requests_last_90day
      - avg_requests_last_180day
      - avg_requests_last_365day
      - stddev_requests_last_3day
      - stddev_requests_last_7day
      - stddev_requests_last_14day
      - stddev_requests_last_28day
      - stddev_requests_last_90day
      - stddev_requests_last_180day
      - stddev_requests_last_365day
      - request_days_last_3day
      - request_days_last_7day
      - request_days_last_14day
      - request_days_last_28day
      - request_days_last_90day
      - request_days_last_180day
      - request_days_last_365day
      - cv_requests_last_3day
      - cv_requests_last_7day
      - cv_requests_last_14day
      - cv_requests_last_28day
      - cv_requests_last_90day
      - cv_requests_last_180day
      - cv_requests_last_365day

    requests_dayofweek:
      - avg_requests_last_7day_dow
      - avg_requests_last_14day_dow
      - avg_requests_last_28day_dow

    requests_period_over_period:
      - requests_pop_3day
      - requests_pop_7day
      - requests_pop_14day
      - requests_pop_28day
      - requests_pop_90day
      - requests_pop_180day
      - requests_pop_365day
      - requests_pop_7day_dow
      - requests_pop_14day_dow
      - requests_pop_28day_dow

  model_configs:

    - model_name: agency_next_day_requests_xgboost
      version: v1.0
      lifecycle: prod
      interval: day
      include_in_run: true
      include_in_forecast: true
      model_type: BOOSTED_TREE_REGRESSOR
      input_label_cols:
        - requests_next_1day
      parameters:
        booster_type: GBTREE
        num_parallel_tree: 1
        max_iterations: 50
        learn_rate: 0.1
        max_tree_depth: 6
        min_tree_child_weight: 1
        min_split_loss: 0.0
        subsample: 0.8
        colsample_bytree: 0.8
        colsample_bylevel: 0.8
        colsample_bynode: 0.8
        l1_reg: 0.1
        l2_reg: 0.1
        early_stop: true
        min_rel_progress: 0.001
        data_split_method: SEQ
        data_split_eval_fraction: 0.2
        data_split_col: asof_date
        enable_global_explain: true
        xgboost_version: '1.1'
      feature_set_groups:
        - datetime
        - request_counts
        - request_metrics
        - requests_period_over_period
      feature_columns:
        - agency_code
        - asof_date
      data:
        train:
          source_sql: |
            select *
            from `the-data-strategist`.`nyc_311_analysis`.`int_agency_daily_features`
            where extract(year from asof_date) between 2019 and 2020
        predict:
          source_sql: |
            select *
            from `the-data-strategist`.`nyc_311_analysis`.`int_agency_daily_features`
            where extract(year from asof_date) >= {{ var('predict_min_year', 2021) }}
          output_table: ml_agency_daily_predictions
          outcome_field: predicted_requests_next_1day
          id_fields:
            - agency_code
            - asof_date
